services:
  postgres:
    image: postgres:17
    # The seeded dataset is ~870MB. The 128MB default shared_buffers would make
    # this benchmark a disk-I/O measurement, so give Postgres room to hold it.
    command: >
      postgres -c shared_buffers=1GB -c effective_cache_size=3GB
               -c max_connections=300
    environment:
      POSTGRES_DB: bench
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
    ports:
      - "5432:5432"
    volumes:
      # Seeded once at first start; the apps never run DDL.
      - ../common/src/main/resources/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    depends_on:
      - prometheus
