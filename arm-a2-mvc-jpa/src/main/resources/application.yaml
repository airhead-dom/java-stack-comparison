spring:
  application:
    name: arm-a2-mvc-jpa
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bench}
    username: ${DB_USER:bench}
    password: ${DB_PASSWORD:bench}
    hikari:
      pool-name: bench-pool
      # The experimental constant. Identical in every blocking arm.
      maximum-pool-size: ${POOL_SIZE:10}
      minimum-idle: ${POOL_SIZE:10}
      connection-timeout: 10000
  jpa:
    # MUST stay false. Open-session-in-view holds a pooled connection for the
    # whole request, including the outbound call in /composite, which would
    # silently change the effective concurrency ceiling of this arm alone.
    open-in-view: false
    hibernate:
      ddl-auto: none

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      arm: arm-a2-mvc-jpa
