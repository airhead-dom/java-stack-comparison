spring:
  application:
    name: mvc-virtual
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bench}
    username: ${DB_USER:bench}
    password: ${DB_PASSWORD:bench}
    hikari:
      pool-name: bench-pool
      # The experimental constant. Identical in every blocking variant.
      maximum-pool-size: ${POOL_SIZE:20}
      minimum-idle: ${POOL_SIZE:20}
      connection-timeout: 10000

benchmark:
  upstream:
    base-url: ${UPSTREAM_URL:http://localhost:9099}
    # 200ms puts ~200 requests in flight at the 1,000 TPS target, which is
    # exactly Tomcat's default thread count. The rate ladder walks across it.
    delay-ms: ${UPSTREAM_DELAY_MS:200}
    # The long-wait workloads. Nothing about a thread count binds at these
    # delays; what grows is the number of requests simultaneously in flight --
    # 800 and 1,000 respectively at the 1,000 TPS target -- so they measure what
    # each stack spends to hold a waiting request rather than to run one.
    long-delay-ms: ${UPSTREAM_LONG_DELAY_MS:800}
    longest-delay-ms: ${UPSTREAM_LONGEST_DELAY_MS:1000}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      variant: mvc-virtual
