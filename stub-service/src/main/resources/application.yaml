spring:
  application:
    name: stub-service

server:
  port: 9099

management:
  endpoints:
    web:
      exposure:
        # prometheus, not just health. The long-wait workloads drive up to 2,000
        # connections into this process at once, and the claim that the stub was
        # never the bottleneck needs its own in-flight count, CPU and open file
        # count as evidence rather than an assumption.
        include: health,prometheus
  metrics:
    tags:
      variant: stub-service
