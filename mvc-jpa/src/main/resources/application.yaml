spring:
  application:
    name: mvc-jpa
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bench}
    username: ${DB_USER:bench}
    password: ${DB_PASSWORD:bench}
    hikari:
      pool-name: bench-pool
      # The experimental constant. Identical in every blocking variant.
      maximum-pool-size: ${POOL_SIZE:20}
      minimum-idle: ${POOL_SIZE:20}
      connection-timeout: 10000
  jpa:
    # MUST stay false. Open-session-in-view holds a pooled connection for the
    # whole request, including the outbound call in /composite, which would
    # silently change the effective concurrency ceiling of this variant alone.
    open-in-view: false
    hibernate:
      ddl-auto: none

benchmark:
  upstream:
    base-url: ${UPSTREAM_URL:http://localhost:9099}
    # 200ms puts ~200 requests in flight at the 1,000 TPS target, which is
    # exactly Tomcat's default thread count. The rate ladder walks across it.
    delay-ms: ${UPSTREAM_DELAY_MS:200}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      variant: mvc-jpa
